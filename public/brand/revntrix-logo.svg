<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C64E" />
      <stop offset="50%" stop-color="#D4A72C" />
      <stop offset="100%" stop-color="#8F6415" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Logo Emblem: Hexagonal Diamond/Matrix R Prism -->
  <g transform="translate(10, 8)">
    <polygon points="22,2 40,12 40,32 22,42 4,32 4,12" fill="url(#charcoalGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="22,6 36,14 36,30 22,38 8,30 8,14" fill="#080808" opacity="0.8" />
    <!-- Dynamic 'R' + Apex Apex Vector -->
    <path d="M16 14 H25 C28 14 30 16 30 19 C30 22 28 24 25 24 H16 V32 M16 23 H24 M23 23 L29 32" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="22" cy="10" r="1.5" fill="#F3C64E" filter="url(#goldGlow)" />
  </g>

  <!-- Wordmark -->
  <text x="64" y="38" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="#F7F7F5">
    REVN<tspan fill="url(#goldGrad)">TRIX</tspan>
  </text>
  <text x="65" y="49" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.2" fill="#A7A7A0">
    DESIGN ARCHITECTURE
  </text>
</svg>
